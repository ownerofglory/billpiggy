name: billpiggy-local

services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billpiggy}
      POSTGRES_USER: ${POSTGRES_USER:-billpiggy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billpiggy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - billpiggy-postgres-data:/var/lib/postgresql/data

  # Local S3-compatible storage, matching what Terraform provisions in the
  # cluster. Credentials here are development-only; production uses a scoped
  # application user rather than the root account.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-billpiggy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-billpiggy-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - billpiggy-minio-data:/data

  # Creates the bucket the application expects, then exits.
  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-billpiggy} $${MINIO_ROOT_PASSWORD:-billpiggy-dev-secret} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET:-billpiggy}
      "

volumes:
  billpiggy-postgres-data:
  billpiggy-minio-data:
