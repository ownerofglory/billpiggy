name: billpiggy-local

services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billpiggy}
      POSTGRES_USER: ${POSTGRES_USER:-billpiggy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billpiggy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - billpiggy-postgres-data:/var/lib/postgresql/data

volumes:
  billpiggy-postgres-data:
