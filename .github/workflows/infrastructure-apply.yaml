name: Apply production infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        required: true
        type: choice
        options: [plan, apply]
      confirm:
        description: Type APPLY when action is apply
        required: false
        type: string

permissions:
  contents: read

# Serializes runs of this workflow so two plans/applies can never race each
# other for the same state, on top of (not instead of) the backend's own
# native locking — belt and suspenders for the one resource in this repo
# that has no way to recover from a torn concurrent write.
concurrency:
  group: billpiggy-infrastructure
  cancel-in-progress: false

jobs:
  infrastructure:
    runs-on: ubuntu-22.04
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    env:
      KUBERNETES_CA_DATA: ${{ secrets.KUBERNETES_CA_DATA }}
      KUBERNETES_CLUSTER_SERVER_URL: ${{ secrets.KUBERNETES_CLUSTER_SERVER_URL }}
      KUBERNETES_NAMESPACE: ${{ secrets.KUBERNETES_NAMESPACE }}
      KUBERNETES_CLIENT_CA_DATA: ${{ secrets.KUBERNETES_CLIENT_CA_DATA }}
      KUBERNETES_CLIENT_KEY_DATA: ${{ secrets.KUBERNETES_CLIENT_KEY_DATA }}
      # Cloudflare R2 state backend, addressed through Terraform's S3 backend
      # (R2 exposes an S3-compatible API). TF_STATE_BUCKET/KEY/ENDPOINT render
      # into backend.hcl below; AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY are read
      # directly by the backend's AWS SDK, so no credential is ever written
      # to a file on the runner. See infra/terraform/README.md.
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
      TF_STATE_ENDPOINT: ${{ secrets.TF_STATE_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
      TF_VAR_minio_root_user: ${{ secrets.MINIO_ROOT_USER }}
      TF_VAR_minio_root_password: ${{ secrets.MINIO_ROOT_PASSWORD }}
      TF_VAR_minio_app_user: ${{ secrets.MINIO_APP_USER }}
      TF_VAR_minio_app_password: ${{ secrets.MINIO_APP_PASSWORD }}
      TF_VAR_minio_backup_user: ${{ secrets.MINIO_BACKUP_USER }}
      TF_VAR_minio_backup_password: ${{ secrets.MINIO_BACKUP_PASSWORD }}
      TF_VAR_namespace: ${{ vars.INFRASTRUCTURE_NAMESPACE || 'billpiggy-infra' }}
      TF_VAR_storage_class: ${{ vars.K3S_STORAGE_CLASS || 'local-path' }}
      TF_VAR_postgres_backup_schedule: ${{ vars.POSTGRES_BACKUP_SCHEDULE || '0 3 * * *' }}
      TF_VAR_minio_backup_schedule: ${{ vars.MINIO_BACKUP_SCHEDULE || '30 3 * * *' }}
      TF_VAR_backup_retention_days: ${{ vars.BACKUP_RETENTION_DAYS || '14' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure cluster access
        run: envsubst < ../../.kube/config > "$RUNNER_TEMP/kubeconfig"
      - name: Configure Terraform state backend
        run: envsubst < backend.hcl.tmpl > "$RUNNER_TEMP/backend.hcl"
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform
        env:
          TF_VAR_kubeconfig_path: ${{ runner.temp }}/kubeconfig
        run: |
          terraform init -input=false -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform validate -no-color
      - name: Plan infrastructure
        env:
          TF_VAR_kubeconfig_path: ${{ runner.temp }}/kubeconfig
        run: terraform plan -input=false -out=tfplan
      - name: Apply infrastructure
        if: ${{ inputs.action == 'apply' && inputs.confirm == 'APPLY' }}
        env:
          TF_VAR_kubeconfig_path: ${{ runner.temp }}/kubeconfig
        run: terraform apply -input=false tfplan
