name: Publish OpenAPI specification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make generate
      - id: version
        shell: bash
        run: |
          version="$(git describe --tags --always --exclude='openapi-*' "$GITHUB_SHA")"
          echo "tag=openapi-$version" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenAPI ${{ steps.version.outputs.tag }}
          files: api/openapi.yaml
