name: Deploy Kubernetes production

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: Published Helm chart version to deploy
        required: true
        type: string
      image_tag:
        description: Container image tag to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure cluster access
        env:
          KUBERNETES_CA_DATA: ${{ secrets.KUBERNETES_CA_DATA }}
          KUBERNETES_CLUSTER_SERVER_URL: ${{ secrets.KUBERNETES_CLUSTER_SERVER_URL }}
          KUBERNETES_NAMESPACE: ${{ secrets.KUBERNETES_NAMESPACE }}
          KUBERNETES_CLIENT_CA_DATA: ${{ secrets.KUBERNETES_CLIENT_CA_DATA }}
          KUBERNETES_CLIENT_KEY_DATA: ${{ secrets.KUBERNETES_CLIENT_KEY_DATA }}
        run: envsubst < .kube/config > "$RUNNER_TEMP/kubeconfig"
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - id: registry
        name: Resolve chart registry
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "url=oci://ghcr.io/$owner/helm-charts/billpiggy" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        run: echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
      # The application Secret is applied directly with kubectl, outside Helm, so its
      # values never appear in `helm get values`/release metadata. The chart is then
      # deployed with existingSecret pointing at it instead of the secrets.* values —
      # see docs/production-deployment.md#secret-handling.
      - name: Apply application secret
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          KUBERNETES_NAMESPACE: ${{ secrets.KUBERNETES_NAMESPACE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BOOTSTRAP_SUPER_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_SUPER_ADMIN_EMAIL }}
          BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_SUPER_ADMIN_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'billpiggy' }}
          MINIO_USE_SSL: ${{ vars.MINIO_USE_SSL || 'false' }}
        run: |
          kubectl create namespace "$KUBERNETES_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic billpiggy-app \
            --namespace "$KUBERNETES_NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=BOOTSTRAP_SUPER_ADMIN_EMAIL="$BOOTSTRAP_SUPER_ADMIN_EMAIL" \
            --from-literal=BOOTSTRAP_SUPER_ADMIN_PASSWORD="$BOOTSTRAP_SUPER_ADMIN_PASSWORD" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=SMTP_ADDRESS="$SMTP_ADDRESS" \
            --from-literal=SMTP_USERNAME="$SMTP_USERNAME" \
            --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
            --from-literal=SMTP_FROM="$SMTP_FROM" \
            --from-literal=MINIO_ENDPOINT="$MINIO_ENDPOINT" \
            --from-literal=MINIO_ACCESS_KEY="$MINIO_ACCESS_KEY" \
            --from-literal=MINIO_SECRET_KEY="$MINIO_SECRET_KEY" \
            --from-literal=MINIO_BUCKET="$MINIO_BUCKET" \
            --from-literal=MINIO_USE_SSL="$MINIO_USE_SSL" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy chart
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          CHART_REGISTRY: ${{ steps.registry.outputs.url }}
          CHART_VERSION: ${{ inputs.chart_version }}
          IMAGE_REPOSITORY: ${{ vars.DOCKER_IMAGE_NAME || format('{0}/billpiggy', secrets.DOCKER_USER) }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
          INGRESS_CLASS_NAME: ${{ vars.INGRESS_CLASS_NAME || 'nginx' }}
          INGRESS_CLUSTER_ISSUER: ${{ vars.INGRESS_CLUSTER_ISSUER }}
          INGRESS_TLS_SECRET_NAME: ${{ vars.INGRESS_TLS_SECRET_NAME }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
          OPENAI_ASSISTANT_MODEL: ${{ vars.OPENAI_ASSISTANT_MODEL || 'gpt-5.6-luna' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          KUBERNETES_NAMESPACE: ${{ secrets.KUBERNETES_NAMESPACE }}
        run: |
          # Helm's --set mini-language uses commas to separate key=value
          # pairs, so a raw comma-separated CORS_ALLOWED_ORIGINS gets
          # misparsed as multiple assignments ("key ... has no value"). Every
          # comma inside the value itself must be escaped as \, first.
          CORS_ALLOWED_ORIGINS_ESCAPED="${CORS_ALLOWED_ORIGINS//,/\\,}"
          helm upgrade --install billpiggy "$CHART_REGISTRY" \
            --version "$CHART_VERSION" \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set ingress.enabled=true \
            --set-string ingress.host="$INGRESS_HOST" \
            --set-string ingress.className="$INGRESS_CLASS_NAME" \
            --set-string ingress.clusterIssuer="$INGRESS_CLUSTER_ISSUER" \
            --set-string ingress.tlsSecretName="$INGRESS_TLS_SECRET_NAME" \
            --set-string env.logLevel="$LOG_LEVEL" \
            --set-string env.appEnvironment="production" \
            --set-string env.openAIAssistantModel="$OPENAI_ASSISTANT_MODEL" \
            --set-string env.openAIBaseURL="$OPENAI_BASE_URL" \
            --set-string env.corsAllowedOrigins="$CORS_ALLOWED_ORIGINS_ESCAPED" \
            --set-string existingSecret="billpiggy-app" \
            --namespace="$KUBERNETES_NAMESPACE" \
            --create-namespace \
            --wait \
            --timeout 5m
