replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Go's multipart parser can spill upload parts to a temp file once they
# exceed its in-memory threshold, which needs a writable /tmp even though the
# rest of the filesystem stays read-only. tmpSizeLimit bounds the emptyDir so
# a burst of large uploads can't exhaust node memory (emptyDir defaults to
# node storage, but a memory-backed medium would count against pod memory).
tmp:
  sizeLimit: 256Mi

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: false
  className: nginx
  clusterIssuer: ""
  host: ""
  tlsSecretName: ""

env:
  serverAddr: "0.0.0.0:8080"
  logLevel: info
  appEnvironment: production
  # openAIAssistantModel and openAIBaseURL are plain config, not credentials,
  # so they live here rather than in secrets. openAIBaseURL is empty by
  # default, which routes to OpenAI's own endpoint; set it to point the
  # assistant at a compatible gateway instead.
  openAIAssistantModel: gpt-5.6-luna
  openAIBaseURL: ""
  # publicBaseURL is the externally reachable app URL, used to build links in
  # outgoing emails (e.g. an invitation's accept link). Empty falls back to
  # emailing the raw invitation code instead of a clickable link.
  publicBaseURL: ""

# migrationsCheck runs a pre-install/pre-upgrade hook Job that fails the
# release if the image expects migrations the database doesn't have yet,
# instead of rolling out a schema-incompatible deployment. Run the "Apply
# database migrations" workflow first; disable only for local/dev installs
# that don't use the migrations image at all.
migrationsCheck:
  enabled: true

# existingSecret is the recommended way to supply application secrets: point
# it at a Secret created outside Helm (e.g. via `kubectl apply`) so secret
# values never land in `helm get values`/release metadata. Leave it empty
# only for quick local/dev installs, which fall back to a release-owned
# Secret built from the values below.
existingSecret: ""
secrets:
  databaseURL: ""
  jwtSecret: ""
  bootstrapSuperAdminEmail: ""
  bootstrapSuperAdminPassword: ""
  openAIAPIKey: ""
  smtpAddress: ""
  smtpUsername: ""
  smtpPassword: ""
  smtpFrom: ""
  minioEndpoint: ""
  minioAccessKey: ""
  minioSecretKey: ""
  minioBucket: "billpiggy"
  minioUseSSL: "false"

nodeSelector: {}
tolerations: []
affinity: {}
