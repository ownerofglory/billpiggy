{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "billpiggy.fullname" . }}
  labels:
    {{- include "billpiggy.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ required "ingress.clusterIssuer is required when ingress.enabled is true" .Values.ingress.clusterIssuer | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    # An empty host isn't "no domain configured" — Kubernetes treats a blank
    # Ingress rule host as a catch-all matching every incoming Host header.
    # required() turns a missing INGRESS_HOST into a failed deploy instead of
    # a silently wide-open route.
    - host: {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "billpiggy.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tlsSecretName is required when ingress.enabled is true" .Values.ingress.tlsSecretName | quote }}
{{- end }}
