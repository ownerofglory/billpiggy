basePath: /
definitions:
  domain.ExpenseItem:
    properties:
      amountMinor:
        format: int64
        type: integer
      quantity:
        type: string
      title:
        type: string
    type: object
  domain.ExpenseRecord:
    properties:
      address:
        type: string
      amountMinor:
        format: int64
        type: integer
      categoryID:
        type: string
      categoryName:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.ExpenseItem'
        type: array
      latitude:
        format: float64
        type: number
      longitude:
        format: float64
        type: number
      occurredAt:
        type: string
      ownerID:
        type: string
      receiptObjectKey:
        type: string
      sharedGroupID:
        type: string
      status:
        $ref: '#/definitions/domain.ExpenseStatus'
      tagIDs:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
    type: object
  domain.ExpenseStatus:
    enum:
    - draft
    - confirmed
    - shared
    - reimbursed
    type: string
    x-enum-varnames:
    - ExpenseDraft
    - ExpenseConfirmed
    - ExpenseShared
    - ExpenseReimbursed
  domain.UserRole:
    enum:
    - member
    - admin
    - super_admin
    type: string
    x-enum-varnames:
    - RoleMember
    - RoleAdmin
    - RoleSuperAdmin
  handler.acceptInvitationRequest:
    properties:
      display_name:
        type: string
      password:
        type: string
      token:
        type: string
    type: object
  handler.currentUserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  handler.expenseRequest:
    properties:
      address:
        type: string
      amount_minor:
        type: integer
      category_id:
        type: string
      category_name:
        type: string
      currency:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.ExpenseItem'
        type: array
      latitude:
        type: number
      longitude:
        type: number
      occurred_at:
        type: string
      shared_group_id:
        type: string
      status:
        $ref: '#/definitions/domain.ExpenseStatus'
      tag_ids:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  handler.invitationRequest:
    properties:
      email:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
    type: object
  handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.sessionResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
    type: object
  handler.userResponseBody:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  description: API for personal cost tracking.
  title: BillPiggy API
  version: "1.0"
paths:
  /billpiggy/api/v1/auth/invitations:
    post:
      consumes:
      - application/json
      parameters:
      - description: Invitation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.invitationRequest'
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Invite user
      tags:
      - auth
      - administration
  /billpiggy/api/v1/auth/invitations/accept:
    post:
      consumes:
      - application/json
      parameters:
      - description: Invitation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.acceptInvitationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.userResponseBody'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Accept invitation
      tags:
      - auth
  /billpiggy/api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.sessionResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /billpiggy/api/v1/auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - auth
  /billpiggy/api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.currentUserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user
      tags:
      - auth
  /billpiggy/api/v1/auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.sessionResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh session
      tags:
      - auth
  /billpiggy/api/v1/expenses/:
    get:
      parameters:
      - description: Search title or category
        in: query
        name: q
        type: string
      - description: Category ID
        in: query
        name: category_id
        type: string
      - collectionFormat: csv
        description: Tag IDs
        in: query
        items:
          type: string
        name: tag_id
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ExpenseRecord'
            type: array
      summary: List expenses
      tags:
      - expenses
    post:
      consumes:
      - application/json
      parameters:
      - description: Expense
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.expenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.ExpenseRecord'
      summary: Create expense
      tags:
      - expenses
  /billpiggy/api/v1/expenses/{expenseID}:
    delete:
      parameters:
      - description: Expense ID
        in: path
        name: expenseID
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete expense
      tags:
      - expenses
    get:
      parameters:
      - description: Expense ID
        in: path
        name: expenseID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ExpenseRecord'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get expense
      tags:
      - expenses
    put:
      consumes:
      - application/json
      parameters:
      - description: Expense ID
        in: path
        name: expenseID
        required: true
        type: string
      - description: Expense
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.expenseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ExpenseRecord'
      summary: Update expense
      tags:
      - expenses
  /billpiggy/api/v1/version:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get application version
      tags:
      - health
swagger: "2.0"
