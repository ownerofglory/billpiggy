basePath: /
definitions:
  domain.AIUsageSummary:
    properties:
      byWorkload:
        description: ByWorkload lists one entry per workload that made at least one
          request.
        items:
          $ref: '#/definitions/domain.AIWorkloadUsage'
        type: array
      since:
        description: Since is the inclusive start of the summarised window.
        type: string
    type: object
  domain.AIWorkload:
    enum:
    - assistant
    - receipt_extraction
    - sentence_extraction
    - transcription
    type: string
    x-enum-varnames:
    - AIWorkloadAssistant
    - AIWorkloadReceiptExtraction
    - AIWorkloadSentenceExtraction
    - AIWorkloadTranscription
  domain.AIWorkloadUsage:
    properties:
      errorCount:
        type: integer
      inputTokens:
        description: InputTokens and OutputTokens sum token consumption across requests.
        type: integer
      outputTokens:
        type: integer
      requestCount:
        description: RequestCount and ErrorCount tally outcomes.
        type: integer
      workload:
        allOf:
        - $ref: '#/definitions/domain.AIWorkload'
        description: Workload names the feature these totals belong to.
    type: object
  domain.AnalyticsPeriod:
    enum:
    - day
    - week
    - month
    - year
    type: string
    x-enum-varnames:
    - AnalyticsDay
    - AnalyticsWeek
    - AnalyticsMonth
    - AnalyticsYear
  domain.AuditEntry:
    properties:
      action:
        description: Action is the event type that produced the entry.
        type: string
      actorID:
        description: ActorID is the user who caused the event, when known.
        type: string
      eventID:
        description: EventID is the source event, used to make replay idempotent.
        type: string
      metadata:
        additionalProperties:
          type: string
        description: Metadata carries additional non-indexed context.
        type: object
      occurredAt:
        description: OccurredAt is when the command produced the event.
        type: string
      resourceID:
        description: ResourceID is the aggregate the event belongs to.
        type: string
      resourceType:
        description: ResourceType is the aggregate type the event belongs to.
        type: string
    type: object
  domain.BudgetPeriod:
    enum:
    - daily
    - weekly
    - monthly
    - yearly
    - custom
    type: string
    x-enum-varnames:
    - BudgetDaily
    - BudgetWeekly
    - BudgetMonthly
    - BudgetYearly
    - BudgetCustom
  domain.BudgetProgress:
    properties:
      budgetID:
        description: BudgetID identifies the budget.
        type: string
      categoryID:
        description: CategoryID is the budget's category.
        type: string
      currency:
        description: Currency is the ISO 4217 code the amounts are denominated in.
        type: string
      limitMinor:
        description: LimitMinor is the budget's configured limit.
        type: integer
      name:
        description: Name is the budget's display name.
        type: string
      percentUsed:
        description: PercentUsed is the share of the limit consumed, which can exceed
          100.
        type: integer
      period:
        allOf:
        - $ref: '#/definitions/domain.BudgetPeriod'
        description: Period is the budget's configured window.
      periodEnd:
        description: PeriodEnd is the exclusive end of the budget's current window.
        type: string
      periodStart:
        description: PeriodStart is the inclusive start of the budget's current window.
        type: string
      spentMinor:
        description: SpentMinor is spend against the budget's category within the
          window.
        type: integer
    type: object
  domain.BudgetRecord:
    properties:
      amountLimitMinor:
        description: AmountLimitMinor is the limit in the currency's minor units.
        type: integer
      categoryID:
        type: string
      createdAt:
        description: CreatedAt and UpdatedAt record projection timestamps.
        type: string
      currency:
        type: string
      deletedAt:
        description: DeletedAt marks a soft-deleted budget.
        type: string
      dueAt:
        description: DueAt optionally caps a custom budget.
        type: string
      id:
        description: ID identifies the budget.
        type: string
      name:
        type: string
      ownerID:
        type: string
      period:
        allOf:
        - $ref: '#/definitions/domain.BudgetPeriod'
        description: Period defines the budget window.
      sharedGroupID:
        type: string
      thresholdPercent:
        description: ThresholdPercent triggers an alert when this percentage is reached.
        type: integer
      updatedAt:
        type: string
    type: object
  domain.BudgetSuggestion:
    properties:
      budgetID:
        type: string
      categoryID:
        type: string
      currency:
        type: string
      limitMinor:
        type: integer
      message:
        type: string
      percentUsed:
        type: integer
      spentMinor:
        type: integer
    type: object
  domain.BurnRate:
    properties:
      averagePerDayMinor:
        description: AveragePerDayMinor is SpentMinor divided by DaysElapsed.
        type: integer
      currency:
        description: Currency is the ISO 4217 code the amounts are denominated in.
        type: string
      daysElapsed:
        description: DaysElapsed is the number of days of the bucket that have occurred
          so far.
        type: integer
      daysTotal:
        description: DaysTotal is the bucket's full length in days.
        type: integer
      expectedMinor:
        description: |-
          ExpectedMinor sums the limits of budgets whose period and currency match
          this bucket; zero when no such budget is configured.
        type: integer
      period:
        allOf:
        - $ref: '#/definitions/domain.AnalyticsPeriod'
        description: Period is the granularity the burn rate is computed over.
      periodEnd:
        description: PeriodEnd is the exclusive end of the current bucket.
        type: string
      periodStart:
        description: PeriodStart is the inclusive start of the current bucket.
        type: string
      projectedTotalMinor:
        description: ProjectedTotalMinor is AveragePerDayMinor extrapolated across
          DaysTotal.
        type: integer
      spentMinor:
        description: SpentMinor is spend so far in the current bucket, in minor units.
        type: integer
    type: object
  domain.CategoryChange:
    properties:
      categoryID:
        description: CategoryID identifies the compared category.
        type: string
      currency:
        description: Currency is the ISO 4217 code the amounts are denominated in.
        type: string
      currentMinor:
        description: CurrentMinor is the current bucket's total, in minor currency
          units.
        type: integer
      expenseCount:
        description: ExpenseCount is the number of expenses in the current bucket.
        type: integer
      percentChange:
        description: PercentChange is nil when PreviousMinor is zero.
        type: number
      previousMinor:
        description: PreviousMinor is the previous bucket's total, in minor currency
          units.
        type: integer
    type: object
  domain.DailyTotal:
    properties:
      amountMinor:
        description: AmountMinor is the day's total, in minor currency units.
        type: integer
      currency:
        description: Currency is the ISO 4217 code the amount is denominated in.
        type: string
      date:
        description: Date is the day the total applies to.
        type: string
      expenseCount:
        description: ExpenseCount is the number of expenses on that day.
        type: integer
    type: object
  domain.ExpenseCategory:
    properties:
      color:
        description: Color is an optional hex swatch used by clients.
        type: string
      createdAt:
        description: CreatedAt is when the category was created.
        type: string
      id:
        description: ID identifies the category.
        type: string
      isDefault:
        description: IsDefault marks a category the application ships for every user.
        type: boolean
      name:
        description: Name is the display name.
        type: string
    type: object
  domain.ExpenseItem:
    properties:
      amountMinor:
        type: integer
      quantity:
        type: string
      title:
        type: string
    type: object
  domain.ExpenseRecord:
    properties:
      address:
        type: string
      amountMinor:
        type: integer
      categoryID:
        type: string
      categoryName:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.ExpenseItem'
        type: array
      latitude:
        type: number
      longitude:
        type: number
      occurredAt:
        type: string
      ownerID:
        type: string
      receiptObjectKey:
        type: string
      sharedGroupID:
        type: string
      status:
        $ref: '#/definitions/domain.ExpenseStatus'
      tagIDs:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
    type: object
  domain.ExpenseRollup:
    properties:
      amountMinor:
        description: AmountMinor is the aggregate in currency minor units.
        type: integer
      categoryID:
        description: CategoryID optionally identifies the aggregated category.
        type: string
      currency:
        description: Currency is the ISO 4217 currency code.
        type: string
      expenseCount:
        description: ExpenseCount is the number of included expenses.
        type: integer
      ownerID:
        description: OwnerID identifies the user whose expenses were aggregated.
        type: string
      period:
        allOf:
        - $ref: '#/definitions/domain.AnalyticsPeriod'
        description: Period identifies the rollup window size.
      periodStart:
        description: PeriodStart is the inclusive start of the aggregation window.
        type: string
      tagID:
        description: TagID optionally identifies the aggregated tag.
        type: string
    type: object
  domain.ExpenseStatus:
    enum:
    - draft
    - confirmed
    - shared
    - reimbursed
    type: string
    x-enum-varnames:
    - ExpenseDraft
    - ExpenseConfirmed
    - ExpenseShared
    - ExpenseReimbursed
  domain.ExpenseTag:
    properties:
      color:
        description: Color is an optional hex swatch used by clients.
        type: string
      createdAt:
        description: CreatedAt is when the tag was created.
        type: string
      id:
        description: ID identifies the tag.
        type: string
      name:
        description: Name is the display name.
        type: string
    type: object
  domain.ExtractedExpense:
    properties:
      address:
        description: Address is the merchant's address as printed on the receipt,
          if any.
        type: string
      amount_minor:
        description: AmountMinor is the total amount in minor currency units.
        type: integer
      category_name:
        description: CategoryName is a free-text category guess.
        type: string
      currency:
        description: Currency is the ISO 4217 currency code.
        type: string
      items:
        description: |-
          Items breaks the total down when more than one thing was mentioned. Empty
          when only one thing was mentioned; strict structured-output schemas
          require every property to be present, so this can't be omitempty.
        items:
          $ref: '#/definitions/domain.ExtractedExpenseItem'
        type: array
      occurred_at:
        description: OccurredAt is when the expense happened.
        type: string
      title:
        description: Title is a short human title for the expense.
        type: string
    type: object
  domain.ExtractedExpenseItem:
    properties:
      amount_minor:
        description: AmountMinor is the item's amount in minor currency units.
        type: integer
      title:
        description: Title is what this line item was for.
        type: string
    type: object
  domain.PaymentFrequency:
    enum:
    - monthly
    - quarterly
    - yearly
    - custom
    type: string
    x-enum-varnames:
    - PaymentMonthly
    - PaymentQuarterly
    - PaymentYearly
    - PaymentCustom
  domain.PeriodComparison:
    properties:
      currentStart:
        description: CurrentStart is the inclusive start of the current bucket.
        type: string
      period:
        allOf:
        - $ref: '#/definitions/domain.AnalyticsPeriod'
        description: Period is the granularity being compared.
      previousStart:
        description: PreviousStart is the inclusive start of the immediately preceding
          bucket.
        type: string
      totals:
        description: Totals holds one entry per currency observed in either bucket.
        items:
          $ref: '#/definitions/domain.PeriodComparisonTotal'
        type: array
    type: object
  domain.PeriodComparisonTotal:
    properties:
      currency:
        description: Currency is the ISO 4217 code the amounts are denominated in.
        type: string
      currentMinor:
        description: CurrentMinor is the current bucket's total, in minor currency
          units.
        type: integer
      percentChange:
        description: |-
          PercentChange is nil when PreviousMinor is zero, since there is nothing
          to compare the current amount against.
        type: number
      previousMinor:
        description: PreviousMinor is the previous bucket's total, in minor currency
          units.
        type: integer
    type: object
  domain.Report:
    properties:
      createdAt:
        description: CreatedAt is when the report was generated.
        type: string
      format:
        allOf:
        - $ref: '#/definitions/domain.ReportFormat'
        description: Format is the file format the report was rendered in.
      id:
        description: ID identifies the report.
        type: string
      objectKey:
        description: ObjectKey is the report's location in object storage.
        type: string
      ownerID:
        description: OwnerID is the user the report was generated for.
        type: string
      periodKind:
        allOf:
        - $ref: '#/definitions/domain.AnalyticsPeriod'
        description: 'PeriodKind is the report''s granularity: week, month, or year.'
      periodStart:
        description: PeriodStart is the inclusive start of the reported period.
        type: string
    type: object
  domain.ReportFormat:
    enum:
    - csv
    - pdf
    type: string
    x-enum-varnames:
    - ReportFormatCSV
    - ReportFormatPDF
  domain.ScheduledPayment:
    properties:
      amountMinor:
        description: AmountMinor is the recurring amount in the currency's minor units.
        type: integer
      autoPost:
        description: |-
          AutoPost creates a confirmed expense automatically as each occurrence
          falls due. When false the payment only notifies, and the user records
          the expense themselves.
        type: boolean
      categoryID:
        description: CategoryID and CategoryName classify the expenses this payment
          creates.
        type: string
      categoryName:
        type: string
      createdAt:
        description: CreatedAt and UpdatedAt record projection timestamps.
        type: string
      currency:
        description: Currency is the ISO 4217 currency code.
        type: string
      customIntervalDays:
        description: |-
          CustomIntervalDays is the gap between occurrences when Frequency is
          PaymentCustom, and is ignored otherwise.
        type: integer
      deletedAt:
        description: DeletedAt marks a soft-deleted payment.
        type: string
      endDate:
        description: EndDate optionally stops the recurrence; occurrences after it
          never run.
        type: string
      frequency:
        allOf:
        - $ref: '#/definitions/domain.PaymentFrequency'
        description: Frequency is how often the payment recurs.
      id:
        description: ID identifies the scheduled payment.
        type: string
      lastPostedAt:
        description: LastPostedAt is when an occurrence last fell due, if one ever
          has.
        type: string
      nextDueAt:
        description: NextDueAt is the next occurrence the scheduler has yet to handle.
        type: string
      ownerID:
        description: OwnerID is the user the payment belongs to.
        type: string
      paused:
        description: Paused suspends the payment without deleting it.
        type: boolean
      reminderDaysBefore:
        description: |-
          ReminderDaysBefore sends an advance notice this many days before an
          occurrence. Zero disables the advance notice.
        type: integer
      sharedGroupID:
        description: |-
          SharedGroupID optionally shares the payment, and the expenses it
          creates, with a user group.
        type: string
      startDate:
        description: StartDate is the first occurrence and the permanent recurrence
          anchor.
        type: string
      tagIDs:
        description: TagIDs are copied onto every expense this payment creates.
        items:
          type: string
        type: array
      title:
        description: Title is the display name, e.g. "Rent".
        type: string
      updatedAt:
        type: string
    type: object
  domain.UserGroup:
    properties:
      createdAt:
        description: CreatedAt records when the group was created.
        type: string
      createdBy:
        description: CreatedBy identifies the administrator who owns the group.
        type: string
      id:
        description: ID uniquely identifies the group.
        type: string
      memberIDs:
        description: MemberIDs lists users permitted to view shared items.
        items:
          type: string
        type: array
      name:
        description: Name is the administrator-visible group name.
        type: string
    type: object
  domain.UserRole:
    enum:
    - member
    - admin
    - super_admin
    type: string
    x-enum-varnames:
    - RoleMember
    - RoleAdmin
    - RoleSuperAdmin
  domain.WeekdayTotal:
    properties:
      amountMinor:
        description: AmountMinor is the weekday's total, in minor currency units.
        type: integer
      currency:
        description: Currency is the ISO 4217 code the amount is denominated in.
        type: string
      expenseCount:
        description: ExpenseCount is the number of expenses on that weekday.
        type: integer
      weekday:
        description: |-
          Weekday identifies the day of the week the total applies to, using Go's
          time.Weekday encoding (0=Sunday..6=Saturday). Plain int rather than
          time.Weekday itself so the OpenAPI generator can describe the field.
        type: integer
    type: object
  handler.acceptInvitationRequest:
    properties:
      display_name:
        type: string
      password:
        type: string
      token:
        type: string
    type: object
  handler.assistantRequest:
    properties:
      message:
        type: string
    type: object
  handler.budgetRequest:
    properties:
      amount_limit_minor:
        type: integer
      category_id:
        type: string
      currency:
        type: string
      due_at:
        type: string
      name:
        type: string
      period:
        $ref: '#/definitions/domain.BudgetPeriod'
      shared_group_id:
        type: string
      threshold_percent:
        type: integer
    type: object
  handler.changePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  handler.createGroupRequest:
    properties:
      member_ids:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  handler.currentUserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  handler.dictateResponse:
    properties:
      draft:
        $ref: '#/definitions/domain.ExtractedExpense'
      transcript:
        type: string
    type: object
  handler.expenseRequest:
    properties:
      address:
        type: string
      amount_minor:
        type: integer
      category_id:
        type: string
      category_name:
        type: string
      currency:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.ExpenseItem'
        type: array
      latitude:
        type: number
      longitude:
        type: number
      occurred_at:
        type: string
      shared_group_id:
        type: string
      status:
        $ref: '#/definitions/domain.ExpenseStatus'
      tag_ids:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  handler.intelligentRequest:
    properties:
      text:
        type: string
    type: object
  handler.invitationRequest:
    properties:
      email:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
    type: object
  handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.manageUserRequest:
    properties:
      access_blocked:
        type: boolean
      role:
        $ref: '#/definitions/domain.UserRole'
    type: object
  handler.passwordResetConfirmRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  handler.passwordResetRequestBody:
    properties:
      email:
        type: string
    type: object
  handler.profileRequest:
    properties:
      ai_enabled:
        type: boolean
      display_name:
        type: string
      email:
        type: string
      email_notifications_enabled:
        type: boolean
    type: object
  handler.scheduledPaymentRequest:
    properties:
      amount_minor:
        type: integer
      auto_post:
        type: boolean
      category_id:
        type: string
      category_name:
        type: string
      currency:
        type: string
      custom_interval_days:
        type: integer
      end_date:
        type: string
      frequency:
        $ref: '#/definitions/domain.PaymentFrequency'
      paused:
        type: boolean
      reminder_days_before:
        type: integer
      shared_group_id:
        type: string
      start_date:
        type: string
      tag_ids:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  handler.sessionResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
    type: object
  handler.taxonomyRequest:
    properties:
      color:
        type: string
      name:
        type: string
    type: object
  handler.updateGroupRequest:
    properties:
      name:
        type: string
    type: object
  handler.userResponseBody:
    properties:
      access_blocked:
        type: boolean
      ai_enabled:
        type: boolean
      display_name:
        type: string
      email:
        type: string
      email_notifications_enabled:
        type: boolean
      id:
        type: string
      notification_preferences:
        additionalProperties:
          type: boolean
        type: object
      role:
        type: string
    type: object
  service.UsageSummary:
    properties:
      ai:
        allOf:
        - $ref: '#/definitions/domain.AIUsageSummary'
        description: AI summarises AI provider usage and cost since Since.
      auditEntryCount:
        description: |-
          AuditEntryCount counts audit entries since Since, capped at
          auditSummaryScanLimit.
        type: integer
      blockedUsers:
        type: integer
      notificationsByStatus:
        additionalProperties:
          type: integer
        description: NotificationsByStatus tallies the notification queue's current
          state.
        type: object
      since:
        description: Since is the inclusive start of the summarised window.
        type: string
      totalUsers:
        description: TotalUsers, UsersByRole, and BlockedUsers describe the current
          account population.
        type: integer
      usersByRole:
        additionalProperties:
          type: integer
        type: object
    type: object
info:
  contact: {}
  description: API for personal cost tracking.
  title: BillPiggy API
  version: "1.0"
paths:
  /billpiggy/api/v1/admin/usage:
    get:
      parameters:
      - description: RFC3339 inclusive start; defaults to the last 24 hours
        in: query
        name: since
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.UsageSummary'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get super-admin usage summary
      tags:
      - administration
  /billpiggy/api/v1/analytics/budget-progress:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.BudgetProgress'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get every budget's spend against its limit for its current period
      tags:
      - analytics
  /billpiggy/api/v1/analytics/burn-rate:
    get:
      parameters:
      - description: day, week, month, or year
        in: query
        name: period
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.BurnRate'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get spend-so-far, projected total, and budget target for the current
        period
      tags:
      - analytics
  /billpiggy/api/v1/analytics/category-changes:
    get:
      parameters:
      - description: day, week, month, or year
        in: query
        name: period
        required: true
        type: string
      - description: Max categories to return (default 10, max 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.CategoryChange'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Rank categories by spend change against the previous period
      tags:
      - analytics
  /billpiggy/api/v1/analytics/comparison:
    get:
      parameters:
      - description: day, week, month, or year
        in: query
        name: period
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PeriodComparison'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Compare the current period against the previous one
      tags:
      - analytics
