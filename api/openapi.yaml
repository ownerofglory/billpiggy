basePath: /
definitions:
  domain.AIUsageSummary:
    properties:
      byWorkload:
        description: ByWorkload lists one entry per workload that made at least one
          request.
        items:
          $ref: '#/definitions/domain.AIWorkloadUsage'
        type: array
      since:
        description: Since is the inclusive start of the summarised window.
        type: string
    type: object
  domain.AIWorkload:
    enum:
    - assistant
    - receipt_extraction
    - sentence_extraction
    - transcription
    type: string
    x-enum-varnames:
    - AIWorkloadAssistant
    - AIWorkloadReceiptExtraction
    - AIWorkloadSentenceExtraction
    - AIWorkloadTranscription
  domain.AIWorkloadUsage:
    properties:
      errorCount:
        description: RequestCount and ErrorCount tally outcomes.
        format: int64
        type: integer
      inputTokens:
        description: InputTokens and OutputTokens sum token consumption across requests.
        format: int64
        type: integer
      outputTokens:
        description: InputTokens and OutputTokens sum token consumption across requests.
        format: int64
        type: integer
      requestCount:
        description: RequestCount and ErrorCount tally outcomes.
        format: int64
        type: integer
      workload:
        allOf:
        - $ref: '#/definitions/domain.AIWorkload'
        description: Workload names the feature these totals belong to.
    type: object
  domain.AnalyticsPeriod:
    enum:
    - day
    - week
    - month
    - year
    type: string
    x-enum-varnames:
    - AnalyticsDay
    - AnalyticsWeek
    - AnalyticsMonth
    - AnalyticsYear
  domain.AuditEntry:
    properties:
      action:
        description: Action is the event type that produced the entry.
        type: string
      actorID:
        description: ActorID is the user who caused the event, when known.
        type: string
      eventID:
        description: EventID is the source event, used to make replay idempotent.
        type: string
      metadata:
        additionalProperties:
          type: string
        description: Metadata carries additional non-indexed context.
        type: object
      occurredAt:
        description: OccurredAt is when the command produced the event.
        type: string
      resourceID:
        description: ResourceID is the aggregate the event belongs to.
        type: string
      resourceType:
        description: ResourceType is the aggregate type the event belongs to.
        type: string
    type: object
  domain.BudgetPeriod:
    enum:
    - daily
    - weekly
    - monthly
    - yearly
    - custom
    type: string
    x-enum-varnames:
    - BudgetDaily
    - BudgetWeekly
    - BudgetMonthly
    - BudgetYearly
    - BudgetCustom
  domain.BudgetRecord:
    properties:
      amountLimitMinor:
        description: AmountLimitMinor is the limit in the currency's minor units.
        format: int64
        type: integer
      categoryID:
        description: ID identifies the budget.
        type: string
      createdAt:
        description: CreatedAt and UpdatedAt record projection timestamps.
        type: string
      currency:
        description: ID identifies the budget.
        type: string
      deletedAt:
        description: DeletedAt marks a soft-deleted budget.
        type: string
      dueAt:
        description: DueAt optionally caps a custom budget.
        type: string
      id:
        description: ID identifies the budget.
        type: string
      name:
        description: ID identifies the budget.
        type: string
      ownerID:
        description: ID identifies the budget.
        type: string
      period:
        allOf:
        - $ref: '#/definitions/domain.BudgetPeriod'
        description: Period defines the budget window.
      sharedGroupID:
        description: ID identifies the budget.
        type: string
      thresholdPercent:
        description: ThresholdPercent triggers an alert when this percentage is reached.
        type: integer
      updatedAt:
        description: CreatedAt and UpdatedAt record projection timestamps.
        type: string
    type: object
  domain.BudgetSuggestion:
    properties:
      budgetID:
        type: string
      categoryID:
        type: string
      currency:
        type: string
      limitMinor:
        format: int64
        type: integer
      message:
        type: string
      percentUsed:
        type: integer
      spentMinor:
        format: int64
        type: integer
    type: object
  domain.ExpenseCategory:
    properties:
      color:
        description: Color is an optional hex swatch used by clients.
        type: string
      createdAt:
        description: CreatedAt is when the category was created.
        type: string
      id:
        description: ID identifies the category.
        type: string
      isDefault:
        description: IsDefault marks a category the application ships for every user.
        type: boolean
      name:
        description: Name is the display name.
        type: string
    type: object
  domain.ExpenseItem:
    properties:
      amountMinor:
        format: int64
        type: integer
      quantity:
        type: string
      title:
        type: string
    type: object
  domain.ExpenseRecord:
    properties:
      address:
        type: string
      amountMinor:
        format: int64
        type: integer
      categoryID:
        type: string
      categoryName:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.ExpenseItem'
        type: array
      latitude:
        format: float64
        type: number
      longitude:
        format: float64
        type: number
      occurredAt:
        type: string
      ownerID:
        type: string
      receiptObjectKey:
        type: string
      sharedGroupID:
        type: string
      status:
        $ref: '#/definitions/domain.ExpenseStatus'
      tagIDs:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
    type: object
  domain.ExpenseRollup:
    properties:
      amountMinor:
        description: AmountMinor is the aggregate in currency minor units.
        format: int64
        type: integer
      categoryID:
        description: CategoryID optionally identifies the aggregated category.
        type: string
      currency:
        description: Currency is the ISO 4217 currency code.
        type: string
      expenseCount:
        description: ExpenseCount is the number of included expenses.
        format: int64
        type: integer
      ownerID:
        description: OwnerID identifies the user whose expenses were aggregated.
        type: string
      period:
        allOf:
        - $ref: '#/definitions/domain.AnalyticsPeriod'
        description: Period identifies the rollup window size.
      periodStart:
        description: PeriodStart is the inclusive start of the aggregation window.
        type: string
      tagID:
        description: TagID optionally identifies the aggregated tag.
        type: string
    type: object
  domain.ExpenseStatus:
    enum:
    - draft
    - confirmed
    - shared
    - reimbursed
    type: string
    x-enum-varnames:
    - ExpenseDraft
    - ExpenseConfirmed
    - ExpenseShared
    - ExpenseReimbursed
  domain.ExpenseTag:
    properties:
      color:
        description: Color is an optional hex swatch used by clients.
        type: string
      createdAt:
        description: CreatedAt is when the tag was created.
        type: string
      id:
        description: ID identifies the tag.
        type: string
      name:
        description: Name is the display name.
        type: string
    type: object
  domain.ExtractedExpense:
    properties:
      amount_minor:
        description: AmountMinor is the total amount in minor currency units.
        type: integer
      category_name:
        description: CategoryName is a free-text category guess.
        type: string
      currency:
        description: Currency is the ISO 4217 currency code.
        type: string
      items:
        description: Items breaks the total down when more than one thing was mentioned.
        items:
          $ref: '#/definitions/domain.ExtractedExpenseItem'
        type: array
      occurred_at:
        description: OccurredAt is when the expense happened.
        type: string
      title:
        description: Title is a short human title for the expense.
        type: string
    type: object
  domain.ExtractedExpenseItem:
    properties:
      amount_minor:
        description: AmountMinor is the item's amount in minor currency units.
        type: integer
      title:
        description: Title is what this line item was for.
        type: string
    type: object
  domain.Report:
    properties:
      createdAt:
        description: CreatedAt is when the report was generated.
        type: string
      format:
        allOf:
        - $ref: '#/definitions/domain.ReportFormat'
        description: Format is the file format the report was rendered in.
      id:
        description: ID identifies the report.
        type: string
      objectKey:
        description: ObjectKey is the report's location in object storage.
        type: string
      ownerID:
        description: OwnerID is the user the report was generated for.
        type: string
      periodKind:
        allOf:
        - $ref: '#/definitions/domain.AnalyticsPeriod'
        description: 'PeriodKind is the report''s granularity: week, month, or year.'
      periodStart:
        description: PeriodStart is the inclusive start of the reported period.
        type: string
    type: object
  domain.ReportFormat:
    enum:
    - csv
    - pdf
    type: string
    x-enum-varnames:
    - ReportFormatCSV
    - ReportFormatPDF
  domain.UserGroup:
    properties:
      createdAt:
        description: CreatedAt records when the group was created.
        type: string
      createdBy:
        description: CreatedBy identifies the administrator who owns the group.
        type: string
      id:
        description: ID uniquely identifies the group.
        type: string
      memberIDs:
        description: MemberIDs lists users permitted to view shared items.
        items:
          type: string
        type: array
      name:
        description: Name is the administrator-visible group name.
        type: string
    type: object
  domain.UserRole:
    enum:
    - member
    - admin
    - super_admin
    type: string
    x-enum-varnames:
    - RoleMember
    - RoleAdmin
    - RoleSuperAdmin
  handler.acceptInvitationRequest:
    properties:
      display_name:
        type: string
      password:
        type: string
      token:
        type: string
    type: object
  handler.assistantRequest:
    properties:
      message:
        type: string
    type: object
  handler.budgetRequest:
    properties:
      amount_limit_minor:
        type: integer
      category_id:
        type: string
      currency:
        type: string
      due_at:
        type: string
      name:
        type: string
      period:
        $ref: '#/definitions/domain.BudgetPeriod'
      shared_group_id:
        type: string
      threshold_percent:
        type: integer
    type: object
  handler.changePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  handler.createGroupRequest:
    properties:
      member_ids:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  handler.currentUserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  handler.dictateResponse:
    properties:
      draft:
        $ref: '#/definitions/domain.ExtractedExpense'
      transcript:
        type: string
    type: object
  handler.expenseRequest:
    properties:
      address:
        type: string
      amount_minor:
        type: integer
      category_id:
        type: string
      category_name:
        type: string
      currency:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.ExpenseItem'
        type: array
      latitude:
        type: number
      longitude:
        type: number
      occurred_at:
        type: string
      shared_group_id:
        type: string
      status:
        $ref: '#/definitions/domain.ExpenseStatus'
      tag_ids:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  handler.intelligentRequest:
    properties:
      text:
        type: string
    type: object
  handler.invitationRequest:
    properties:
      email:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
    type: object
  handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.manageUserRequest:
    properties:
      access_blocked:
        type: boolean
      role:
        $ref: '#/definitions/domain.UserRole'
    type: object
  handler.profileRequest:
    properties:
      ai_enabled:
        type: boolean
      display_name:
        type: string
      email:
        type: string
      email_notifications_enabled:
        type: boolean
    type: object
  handler.sessionResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
    type: object
  handler.taxonomyRequest:
    properties:
      color:
        type: string
      name:
        type: string
    type: object
  handler.updateGroupRequest:
    properties:
      name:
        type: string
    type: object
  handler.userResponseBody:
    properties:
      ai_enabled:
        type: boolean
      display_name:
        type: string
      email:
        type: string
      email_notifications_enabled:
        type: boolean
      id:
        type: string
      notification_preferences:
        additionalProperties:
          type: boolean
        type: object
      role:
        type: string
    type: object
  service.UsageSummary:
    properties:
      ai:
        allOf:
        - $ref: '#/definitions/domain.AIUsageSummary'
        description: AI summarises AI provider usage and cost since Since.
      auditEntryCount:
        description: |-
          AuditEntryCount counts audit entries since Since, capped at
          auditSummaryScanLimit.
        type: integer
      blockedUsers:
        type: integer
      notificationsByStatus:
        additionalProperties:
          type: integer
        description: NotificationsByStatus tallies the notification queue's current
          state.
        type: object
      since:
        description: Since is the inclusive start of the summarised window.
        type: string
      totalUsers:
        description: TotalUsers, UsersByRole, and BlockedUsers describe the current
          account population.
        type: integer
      usersByRole:
        additionalProperties:
          type: integer
        type: object
    type: object
info:
  contact: {}
  description: API for personal cost tracking.
  title: BillPiggy API
  version: "1.0"
paths:
  /billpiggy/api/v1/admin/usage:
    get:
      parameters:
      - description: RFC3339 inclusive start; defaults to the last 24 hours
        in: query
        name: since
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.UsageSummary'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get super-admin usage summary
      tags:
      - administration
  /billpiggy/api/v1/analytics/expenses:
    get:
      parameters:
      - description: day, week, month, or year
        in: query
        name: period
        required: true
        type: string
      - description: RFC3339 inclusive start
        in: query
        name: from
        required: true
        type: string
      - description: RFC3339 inclusive end
        in: query
        name: to
        required: true
        type: string
      - description: Category ID
        in: query
        name: category_id
        type: string
      - collectionFormat: csv
        description: Tag IDs
        in: query
        items:
          type: string
        name: tag_id
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ExpenseRollup'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get expense analytics
      tags:
      - analytics
  /billpiggy/api/v1/analytics/suggestions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.BudgetSuggestion'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get budget suggestions
      tags:
      - analytics
  /billpiggy/api/v1/assistant/chat:
    post:
      consumes:
      - application/json
      parameters:
      - description: Assistant message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.assistantRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE events: message.started, message.delta, message.completed,
            message.error'
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream an assistant response
      tags:
      - assistant
  /billpiggy/api/v1/audit:
    get:
      parameters:
      - description: Actor user ID
        in: query
        name: actor_id
        type: string
      - description: Aggregate type, e.g. expense, budget, user
        in: query
        name: resource_type
        type: string
      - description: Aggregate ID
        in: query
        name: resource_id
        type: string
      - description: Event type, e.g. expense_added
        in: query
        name: action
        type: string
      - description: RFC3339 inclusive start
        in: query
        name: from
        type: string
      - description: RFC3339 exclusive end
        in: query
        name: to
        type: string
      - description: Page size, default 50, max 200
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.AuditEntry'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List audit entries
      tags:
      - administration
  /billpiggy/api/v1/auth/invitations:
    post:
      consumes:
      - application/json
      parameters:
      - description: Invitation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.invitationRequest'
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Invite user
      tags:
      - auth
      - administration
  /billpiggy/api/v1/auth/invitations/accept:
    post:
      consumes:
      - application/json
      parameters:
      - description: Invitation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.acceptInvitationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.userResponseBody'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Accept invitation
      tags:
      - auth
  /billpiggy/api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.sessionResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /billpiggy/api/v1/auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - auth
  /billpiggy/api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.currentUserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user
      tags:
      - auth
  /billpiggy/api/v1/auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.sessionResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh session
      tags:
      - auth
  /billpiggy/api/v1/budgets/:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.BudgetRecord'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List budgets
      tags:
      - budgets
    post:
      consumes:
      - application/json
      parameters:
      - description: Budget
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.budgetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.BudgetRecord'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create budget
      tags:
      - budgets
  /billpiggy/api/v1/budgets/{budgetID}:
    delete:
      parameters:
      - description: Budget ID
        in: path
        name: budgetID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete budget
      tags:
      - budgets
    get:
      parameters:
      - description: Budget ID
        in: path
        name: budgetID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.BudgetRecord'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get budget
      tags:
      - budgets
    put:
      consumes:
      - application/json
      parameters:
      - description: Budget ID
        in: path
        name: budgetID
        required: true
        type: string
      - description: Budget
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.budgetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.BudgetRecord'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update budget
      tags:
      - budgets
  /billpiggy/api/v1/expenses/:
    get:
      parameters:
      - description: Search title or category
        in: query
        name: q
        type: string
      - description: Category ID
        in: query
        name: category_id
        type: string
      - collectionFormat: csv
        description: Tag IDs
        in: query
        items:
          type: string
        name: tag_id
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ExpenseRecord'
            type: array
      summary: List expenses
      tags:
      - expenses
    post:
      consumes:
      - application/json
      parameters:
      - description: Expense
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.expenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.ExpenseRecord'
      summary: Create expense
      tags:
      - expenses
  /billpiggy/api/v1/expenses/{expenseID}:
    delete:
      parameters:
      - description: Expense ID
        in: path
        name: expenseID
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete expense
      tags:
      - expenses
    get:
      parameters:
      - description: Expense ID
        in: path
        name: expenseID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ExpenseRecord'
